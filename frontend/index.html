<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinRAG 4.6</title>

  <!-- Orbitron for logo, Inter for UI -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=13">

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Set API URL for deployed backend -->
  <script>window.API_URL = "https://rag-sys-gz59.onrender.com";</script>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo-main">FinRAG</div>
      <div class="logo-sub">4.6</div>
    </div>

    <nav class="nav-list">
      <div class="nav-item active" data-page="revert" onclick="loadPage('revert', this)">
        <span class="nav-icon" data-lucide="layout-grid"></span>
        <span>Revert<br>Analysis</span>
      </div>
      <div class="nav-item" data-page="intelligence" onclick="loadPage('intelligence', this)">
        <span class="nav-icon" data-lucide="database"></span>
        Intelligence Cloud
      </div>
      <div class="nav-item" data-page="settings" onclick="loadPage('settings', this)">
        <span class="nav-icon" data-lucide="settings"></span>
        Settings
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="system-stat">
        <span>Engine</span>
        <span class="stat-value">Groq Llama 3.1</span>
      </div>
      <div class="system-stat">
        <span>Latency</span>
        <span class="stat-value">~1.2s</span>
      </div>
      <div class="system-stat">
        <span>Status</span>
        <span style="color: #10b981; font-weight: 700;">STABLE</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="search-container">
        <span class="search-icon" data-lucide="search"></span>
        <input type="text" class="search-input" placeholder="Query entity, trend or ticker...">
      </div>

      <div class="user-controls">
        <span data-lucide="moon" id="dark-mode-icon" onclick="toggleDarkMode()" style="color: #94a3b8; cursor: pointer; padding: 8px; font-size: 18px;" title="Toggle Dark Mode"></span>
        <div class="status-badge">
          <div class="status-dot"></div>
          Online
        </div>
        <div class="user-avatar">AA</div>
      </div>
    </header>

    <div id="content">
      <!-- Content will be injected here -->
    </div>
  </main>

</div>

<script src="/app.js?v=2"></script>
<script src="/ui.js?v=2"></script>

<!-- Pages -->
<script src="/pages/revert.js?v=2"></script>
<script src="/pages/intelligence.js?v=2"></script>
<script src="/pages/settings.js?v=2"></script>

<script>
  lucide.createIcons();
</script>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9999; align-items:center; justify-content:center;"></div>
<div id="toast" class="toast"></div>

</body>
</html>
